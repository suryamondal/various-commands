# /etc/tlp.d/01-battery.conf - charge thresholds for BAT0
# Charging starts below START and stops at STOP.
# Dell: STOP must be at least START + 5, and the firmware obeys these values
# only in Custom charge mode (see README).
#
# Everyday use (mostly plugged in): 75/80
# Capacity test (charge near full):  90/95
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
