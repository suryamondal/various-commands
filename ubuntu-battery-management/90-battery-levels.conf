# /etc/UPower/UPower.conf.d/90-battery-levels.conf
# Low-battery levels; overrides /etc/UPower/UPower.conf.
# Apply with: sudo systemctl restart upower
[UPower]
# "Battery low" warning
PercentageLow=15.0
# "Battery critical" warning
PercentageCritical=10.0
# CriticalPowerAction runs here
PercentageAction=5.0
# Hibernate needs a working resume (see README); otherwise use PowerOff.
CriticalPowerAction=Hibernate
